<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hatimi Hardware - Mobile Pro Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --door-scale: 1;
            --drawer-scale: 1;
            --door-rot: 0deg;
            --drawer-rot: -90deg;
            --door-flip: 1;
            --drawer-flip: 1;
        }

        .bg-hatimi-navy { background-color: #0B192C; }
        .text-hatimi-gold { color: #D4AF37; }
        .bg-hatimi-gold { background-color: #D4AF37; }
        .border-hatimi-gold { border-color: #D4AF37; }
        
        .cabinet-panel {
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.2), inset -3px -3px 8px rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid rgba(0,0,0,0.8);
            background-size: cover;
            background-position: center;
            background-color: #1a202c; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
            position: relative; 
            overflow: visible;
            transform-style: preserve-3d;
        }

        .wardrobe-container { perspective: 1200px; }
        .door-left { transform-origin: left center; cursor: pointer; }
        .door-left.is-open { transform: rotateY(-105deg); }
        .door-right { transform-origin: right center; cursor: pointer; }
        .door-right.is-open { transform: rotateY(105deg); }
        .drawer-panel { transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .drawer-panel.is-open { transform: translateZ(40px) translateY(15px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); z-index: 50; }

        .auto-handle {
            position: absolute;
            transition: transform 0.3s ease, scale 0.3s ease;
            filter: drop-shadow(4px 6px 5px rgba(0,0,0,0.6));
            object-fit: contain;
            pointer-events: none; 
            transform-origin: center center; 
        }

        .pos-door-l {
            right: 15%; top: 50%; max-height: 160px; 
            transform: translate(50%, -50%) scaleX(var(--door-flip)) rotate(var(--door-rot)) scale(var(--door-scale));
        }
        .pos-door-r {
            left: 15%; top: 50%; max-height: 160px;
            transform: translate(-50%, -50%) scaleX(calc(var(--door-flip) * -1)) rotate(calc(var(--door-rot) * -1)) scale(var(--door-scale));
        }
        .pos-drawer {
            left: 50%; top: 50%; max-height: 60px; 
            transform: translate(-50%, -50%) scaleX(var(--drawer-flip)) rotate(var(--drawer-rot)) scale(var(--drawer-scale));
        }

        .btn-premium-card {
            background: linear-gradient(145deg, #1f2937, #111827);
            border: 1px solid #374151;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .btn-premium-card:active { transform: scale(0.98); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 22px; width: 22px; /* Larger for mobile touch */
            border-radius: 50%; background: #D4AF37; cursor: pointer;
            margin-top: -9px; box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer;
            background: #374151; border-radius: 3px;
        }

        .catalog-item-large {
            background: linear-gradient(145deg, #1f2937, #111827);
            border: 1px solid #374151; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; padding: 10px; height: 110px; position: relative;
        }
        .catalog-item-large img {
            max-height: 60px; max-width: 100%; object-fit: contain; 
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.6)); margin-bottom: 6px;
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    </style>
</head>
<body class="bg-gray-900 h-screen w-screen flex flex-col md:flex-row overflow-hidden font-sans">

    <!-- Canvas Section (Top on mobile, Left on desktop) -->
    <div class="h-[45vh] md:h-full flex-1 p-2 md:p-4 flex flex-col items-center justify-center relative overflow-hidden bg-gradient-to-br from-slate-200 to-slate-400">
        <div id="ai-suggestion" class="absolute top-2 left-2 right-2 bg-hatimi-gold text-hatimi-navy font-bold p-2 text-xs rounded shadow-lg text-center hidden z-20"></div>

        <div class="wardrobe-container relative w-[280px] md:max-w-[420px] h-full max-h-[420px] md:max-h-[80vh] bg-gray-900 rounded-sm shadow-2xl p-2 pb-4 flex flex-col gap-2 border-b-[10px] border-black">
            <div class="absolute inset-2 bg-gray-800 shadow-inner flex flex-col gap-1 p-1 z-0">
                <div class="h-1/3 border-b-2 border-gray-950"></div>
                <div class="h-1/3 border-b-2 border-gray-950"></div>
                <div class="flex-1"></div>
            </div>

            <div class="flex-1 flex gap-1 relative z-10 perspective-1000">
                <div id="door-left" class="mica-panel cabinet-panel w-1/2 h-full rounded-sm door-left"></div>
                <div id="door-right" class="mica-panel cabinet-panel w-1/2 h-full rounded-sm door-right"></div>
            </div>
            
            <div class="h-1/4 flex flex-col gap-1 relative z-10">
                <div id="drawer-top" class="mica-panel cabinet-panel drawer-panel w-full h-1/2 rounded-sm"></div>
                <div id="drawer-bottom" class="mica-panel cabinet-panel drawer-panel w-full h-1/2 rounded-sm"></div>
            </div>
        </div>
        <p class="text-[10px] text-gray-700 font-semibold uppercase tracking-wider mt-1">Tap doors/drawers to open</p>
    </div>

    <!-- Controls Section (Bottom on mobile, Right on desktop) -->
    <div class="h-[55vh] md:h-full w-full md:w-[420px] bg-hatimi-navy text-white p-4 md:p-6 shadow-2xl flex flex-col overflow-y-auto border-t-2 md:border-t-0 md:border-l-2 border-hatimi-gold z-50">
        
        <!-- Header -->
        <div class="flex items-center gap-3 mb-4 pb-3 border-b border-gray-800">
            <img src="logo.png" alt="Hatimi Hardware" class="w-9 h-9 object-contain drop-shadow" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='flex';">
            <div id="fallback-logo" style="display:none;" class="w-8 h-8 bg-hatimi-gold rounded-lg items-center justify-center font-bold text-hatimi-navy text-sm">H</div>
            <div>
                <h1 class="text-base font-bold text-white tracking-wide">Hatimi Hardware</h1>
                <h2 class="text-[10px] font-light text-hatimi-gold tracking-widest uppercase">Mobile Visualizer</h2>
            </div>
        </div>

        <!-- 1. Laminate -->
        <div class="mb-4">
            <h3 class="text-[10px] uppercase tracking-widest text-gray-400 mb-2 font-semibold">1. Surface Laminate</h3>
            <div class="grid grid-cols-2 gap-2">
                <div class="flex items-center justify-between bg-[#111827] px-3 py-2 rounded-lg border border-gray-700">
                    <span class="text-xs text-gray-300">Color</span>
                    <input type="color" value="#1a202c" onchange="applySolidColor(this.value)" class="w-7 h-7 cursor-pointer rounded bg-transparent border-0">
                </div>
                <div class="relative bg-[#111827] rounded-lg border border-gray-700 hover:border-hatimi-gold flex items-center justify-center p-2">
                    <label class="flex items-center gap-2 cursor-pointer w-full justify-center">
                        <span class="text-xs font-medium text-gray-300">📷 Scan Mica</span>
                        <input type="file" accept="image/*" class="hidden" onchange="applyMicaImage(event)">
                    </label>
                </div>
            </div>
        </div>

        <!-- 2. Door Hardware -->
        <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700 mb-3 relative">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xs uppercase tracking-widest text-white font-bold">2. Door Hardware</h3>
                <div class="flex gap-2">
                    <button onclick="toggleFlip('door')" class="p-1.5 bg-gray-700 rounded text-gray-300 hover:text-white" title="Flip">↔</button>
                    <button onclick="toggleRotation('door')" class="p-1.5 bg-gray-700 rounded text-gray-300 hover:text-white" title="Rotate">🔄</button>
                </div>
            </div>
            
            <button onclick="openCatalog('door')" class="btn-premium-card w-full rounded-lg p-2.5 flex items-center justify-between mb-3">
                <span class="text-xs font-medium text-white">Select Door Handle</span>
                <span class="text-xs text-hatimi-gold font-bold">Browse &rarr;</span>
            </button>
            
            <div class="flex items-center gap-3 px-1">
                <span class="text-[10px] text-gray-400">Size</span>
                <input type="range" min="0.5" max="3.0" step="0.1" value="1" oninput="updateSize('door', this.value)">
                <span id="door-size-val" class="text-xs text-hatimi-gold font-mono w-8 text-right">100%</span>
            </div>
        </div>

        <!-- 3. Drawer Hardware -->
        <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700 mb-2 relative">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xs uppercase tracking-widest text-white font-bold">3. Drawer Hardware</h3>
                <div class="flex gap-2">
                    <button onclick="toggleFlip('drawer')" class="p-1.5 bg-gray-700 rounded text-gray-300 hover:text-white" title="Flip">↔</button>
                    <button onclick="toggleRotation('drawer')" class="p-1.5 bg-gray-700 rounded text-gray-300 hover:text-white" title="Rotate">🔄</button>
                </div>
            </div>
            
            <button onclick="openCatalog('drawer')" class="btn-premium-card w-full rounded-lg p-2.5 flex items-center justify-between mb-3">
                <span class="text-xs font-medium text-white">Select Drawer Handle</span>
                <span class="text-xs text-gray-300 font-bold">Browse &rarr;</span>
            </button>
            
            <div class="flex items-center gap-3 px-1">
                <span class="text-[10px] text-gray-400">Size</span>
                <input type="range" min="0.3" max="3.0" step="0.1" value="1" oninput="updateSize('drawer', this.value)">
                <span id="drawer-size-val" class="text-xs text-gray-300 font-mono w-8 text-right">100%</span>
            </div>
        </div>
    </div>

    <!-- CATALOG MODAL -->
    <div id="catalog-modal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center backdrop-blur-sm p-3">
        <div class="bg-[#0B192C] border border-gray-700 rounded-xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b border-gray-800 bg-[#0B192C]">
                <h2 id="catalog-title" class="text-base font-bold text-white">Hardware Catalog</h2>
                <button onclick="closeCatalog()" class="text-gray-400 hover:text-white text-2xl px-2">&times;</button>
            </div>
            
            <div id="catalog-grid" class="p-4 grid grid-cols-3 gap-3 overflow-y-auto bg-[#111827] flex-1"></div>

            <div class="p-3 border-t border-gray-800 bg-[#0B192C]">
                <div class="bg-[#111827] p-3 rounded-lg border border-dashed border-hatimi-gold text-center">
                    <label class="cursor-pointer block w-full text-xs font-semibold text-hatimi-gold">
                        ➕ Upload New Handle to Catalog
                        <input type="file" accept="image/*" class="hidden" onchange="triggerUploadPreview(event)">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- ERASER TUNER MODAL -->
    <div id="upload-modal" class="fixed inset-0 bg-black/90 z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-[#0B192C] border border-gray-700 rounded-xl w-full max-w-sm flex flex-col overflow-hidden shadow-2xl">
            <div class="p-3 border-b border-gray-800 font-bold text-white text-sm">Adjust Magic Eraser</div>
            <div class="p-4 flex flex-col items-center bg-checker border-b border-gray-800">
                <canvas id="preview-canvas" class="max-h-40 object-contain"></canvas>
            </div>
            <div class="p-4 bg-[#111827]">
                <div class="flex justify-between text-xs text-gray-400 mb-1">
                    <span>Tolerance</span>
                    <span id="tolerance-val" class="text-hatimi-gold font-mono">20</span>
                </div>
                <input type="range" id="tolerance-slider" min="1" max="80" value="20" oninput="updatePreview()">
            </div>
            <div class="p-3 flex justify-end gap-2 bg-[#0B192C]">
                <button onclick="cancelUpload()" class="px-3 py-1.5 text-gray-400 text-xs">Cancel</button>
                <button onclick="confirmUpload()" class="px-4 py-1.5 bg-hatimi-gold text-hatimi-navy font-bold rounded text-xs">Save</button>
            </div>
        </div>
    </div>

    <script>
        const svgGoldBar = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 150"><rect x="5" y="5" width="20" height="140" rx="6" fill="#D4AF37" stroke="#997A00" stroke-width="1"/><rect x="8" y="8" width="5" height="134" rx="3" fill="#FCF6BA" opacity="0.6"/></svg>');
        const svgBlackMatte = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 150"><rect x="7" y="5" width="16" height="140" rx="3" fill="#222" stroke="#000" stroke-width="2"/><rect x="10" y="10" width="3" height="130" rx="1" fill="#555" opacity="0.4"/></svg>');
        const svgSilverPull = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 150"><path d="M10,10 L30,10 L30,140 L10,140 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/><path d="M5,20 L15,20 L15,130 L5,130 Z" fill="#CBD5E1"/></svg>');
        const svgGoldKnob = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="#D4AF37" stroke="#997A00" stroke-width="2"/><circle cx="20" cy="20" r="10" fill="#FCF6BA" opacity="0.6"/></svg>');

        const defaultInventory = [
            { name: 'Gold Bar', src: svgGoldBar },
            { name: 'Matte Black', src: svgBlackMatte },
            { name: 'Silver Pull', src: svgSilverPull },
            { name: 'Gold Knob', src: svgGoldKnob }
        ];

        let rotState = { door: 0, drawer: -90 };
        let flipState = { door: 1, drawer: 1 };
        let activeZoneForModal = 'door';
        let originalUploadImage = new Image();

        document.querySelectorAll('.door-left, .door-right, .drawer-panel').forEach(panel => {
            panel.addEventListener('click', function(e) { this.classList.toggle('is-open'); });
        });

        function openCatalog(zone) {
            activeZoneForModal = zone;
            document.getElementById('catalog-title').innerText = zone === 'door' ? "Select Door Hardware" : "Select Drawer Hardware";
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            
            let savedHandles = [];
            try { savedHandles = JSON.parse(localStorage.getItem('hatimiHandles')) || []; } catch(e) {}
            let allHandles = defaultInventory.concat(savedHandles);

            allHandles.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'catalog-item-large group';
                div.onclick = () => { injectHandles(item.src, activeZoneForModal); closeCatalog(); };

                const img = document.createElement('img');
                img.src = item.src;
                const nameLabel = document.createElement('span');
                nameLabel.className = 'text-[9px] text-gray-300 font-semibold text-center mt-auto truncate w-full';
                nameLabel.innerText = item.name;

                div.appendChild(img);
                div.appendChild(nameLabel);

                if (index >= defaultInventory.length) {
                    const delBtn = document.createElement('button');
                    delBtn.innerHTML = '✕';
                    delBtn.className = 'absolute top-1 right-1 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px] shadow';
                    delBtn.onclick = (e) => {
                        e.stopPropagation(); 
                        if(confirm(`Delete "${item.name}"?`)) {
                            savedHandles.splice(index - defaultInventory.length, 1);
                            localStorage.setItem('hatimiHandles', JSON.stringify(savedHandles));
                            openCatalog(activeZoneForModal); 
                        }
                    };
                    div.appendChild(delBtn);
                }
                grid.appendChild(div);
            });
            document.getElementById('catalog-modal').classList.remove('hidden');
        }

        function closeCatalog() { document.getElementById('catalog-modal').classList.add('hidden'); }

        function triggerUploadPreview(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                originalUploadImage.onload = function() {
                    document.getElementById('upload-modal').classList.remove('hidden');
                    document.getElementById('tolerance-slider').value = 20; 
                    updatePreview();
                };
                originalUploadImage.src = e.target.result;
            }
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function updatePreview() {
            const canvas = document.getElementById('preview-canvas');
            const ctx = canvas.getContext('2d');
            const tolerance = parseInt(document.getElementById('tolerance-slider').value);
            document.getElementById('tolerance-val').innerText = tolerance;

            const MAX_SIZE = 250; let scale = 1;
            if (originalUploadImage.width > MAX_SIZE || originalUploadImage.height > MAX_SIZE) { 
                scale = Math.min(MAX_SIZE / originalUploadImage.width, MAX_SIZE / originalUploadImage.height); 
            }
            canvas.width = originalUploadImage.width * scale; 
            canvas.height = originalUploadImage.height * scale;
            ctx.drawImage(originalUploadImage, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); 
            const data = imageData.data;
            const w = canvas.width, h = canvas.height;
            const bgR = data[0], bgG = data[1], bgB = data[2];

            const stack = []; const visited = new Uint8Array(w * h);
            for (let x = 0; x < w; x++) { stack.push(x); stack.push((h - 1) * w + x); }
            for (let y = 0; y < h; y++) { stack.push(y * w); stack.push(y * w + (w - 1)); }

            while(stack.length > 0) {
                const idx = stack.pop(); if (visited[idx]) continue;
                const x = idx % w, y = Math.floor(idx / w), p = idx * 4;
                const r = data[p], g = data[p+1], b = data[p+2];
                const colorDiff = Math.sqrt(Math.pow(r - bgR, 2) + Math.pow(g - bgG, 2) + Math.pow(b - bgB, 2));

                if (colorDiff <= tolerance) {
                    visited[idx] = 1; data[p + 3] = 0; 
                    if (x > 0 && !visited[idx - 1]) stack.push(idx - 1);
                    if (x < w - 1 && !visited[idx + 1]) stack.push(idx + 1);
                    if (y > 0 && !visited[idx - w]) stack.push(idx - w);
                    if (y < h - 1 && !visited[idx + w]) stack.push(idx + w);
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function cancelUpload() { document.getElementById('upload-modal').classList.add('hidden'); }

        function confirmUpload() {
            const canvas = document.getElementById('preview-canvas');
            const transparentImgUrl = canvas.toDataURL('image/png');
            let handleName = prompt("Name this hardware:");
            if (handleName !== null) {
                handleName = handleName.trim() || `Custom`;
                try {
                    let saved = JSON.parse(localStorage.getItem('hatimiHandles')) || [];
                    saved.push({ name: handleName, src: transparentImgUrl });
                    localStorage.setItem('hatimiHandles', JSON.stringify(saved));
                } catch (err) {}
            }
            injectHandles(transparentImgUrl, activeZoneForModal);
            document.getElementById('upload-modal').classList.add('hidden');
            closeCatalog();
        }

        function injectHandles(source, targetZone) {
            let targetIDs = targetZone === 'door' ? ['door-left', 'door-right'] : ['drawer-top', 'drawer-bottom'];
            let cssClassBase = targetZone === 'door' ? 'pos-door' : 'pos-drawer';

            targetIDs.forEach((id, index) => {
                const parent = document.getElementById(id);
                parent.querySelectorAll('.auto-handle').forEach(el => el.remove());
                const element = document.createElement('img');
                element.className = `auto-handle ${targetZone === 'door' ? (index === 0 ? 'pos-door-l' : 'pos-door-r') : cssClassBase}`;
                element.src = source;
                parent.appendChild(element);
            });
        }

        function applySolidColor(hexColor) {
            document.querySelectorAll('.mica-panel').forEach(p => { p.style.backgroundImage = 'none'; p.style.backgroundColor = hexColor; });
        }
        function applyMicaImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.querySelectorAll('.mica-panel').forEach(p => { p.style.backgroundImage = `url('${e.target.result}')`; p.style.backgroundColor = 'transparent'; });
            }
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function updateSize(zone, value) {
            document.documentElement.style.setProperty(`--${zone}-scale`, value);
            document.getElementById(`${zone}-size-val`).innerText = Math.round(value * 100) + "%";
        }
        function toggleRotation(zone) {
            rotState[zone] = rotState[zone] === 0 ? -90 : 0;
            document.documentElement.style.setProperty(`--${zone}-rot`, `${rotState[zone]}deg`);
        }
        function toggleFlip(zone) {
            flipState[zone] = flipState[zone] === 1 ? -1 : 1;
            document.documentElement.style.setProperty(`--${zone}-flip`, flipState[zone]);
        }
    </script>
</body>
</html>
